name: build-web-local

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag pushed to GHCR"
        required: false
        default: "htmllogin"

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: "1.27.4"
  FLUTTER_VERSION: "3.41.6"
  IMAGE: ghcr.io/xianer235/gopeed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build flutter web
        run: |
          cd ui/flutter
          flutter build web --no-web-resources-cdn --dart-define="UPDATE_CHANNEL=docker"
          dart ../../.github/workflows/scripts/flutter_local_font.dart
          cd ../..
          rm -rf cmd/web/dist
          cp -r ui/flutter/build/web cmd/web/dist
      - name: Build linux binaries
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          for goarch in amd64 arm64; do
            GOOS=linux GOARCH=$goarch go build -tags nosqlite,web \
              -ldflags="-s -w -X github.com/GopeedLab/gopeed/pkg/base.Version=2.0.0-htmllogin -X github.com/GopeedLab/gopeed/pkg/base.InDocker=true" \
              -o dist/gopeed-linux-$goarch ./cmd/web
          done
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: gopeed-htmllogin-linux
          path: dist/gopeed-linux-*
          if-no-files-found: error
      - name: Build image
        run: |
          tag="${{ github.event.inputs.tag }}"
          mkdir -p image
          cp dist/gopeed-linux-amd64 image/gopeed
          printf 'FROM liwei2633/gopeed:latest\nCOPY gopeed /app/gopeed\n' > image/Dockerfile
          docker build -t "$IMAGE:$tag" image
      - name: Push to GHCR
        run: |
          tag="${{ github.event.inputs.tag }}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$tag"
      - name: Save image tarball
        run: |
          docker save "$IMAGE:${{ github.event.inputs.tag }}" | gzip -1 > gopeed-image-amd64.tar.gz
          ls -lh gopeed-image-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gopeed-image-amd64
          path: gopeed-image-amd64.tar.gz
          if-no-files-found: error
